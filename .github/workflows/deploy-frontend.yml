name: CI/CD Frontend Deployment & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    name: Frontend Quality Gate & Vitest Suite
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Execute Frontend Unit & Component Tests
        run: npm test -- --run

  pricing-regression:
    name: Pricing Regression (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Colombo]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: ${{ matrix.tz }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Verify Golden File Integrity & Remote Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 src/features/invoices/lib/__tests__/fixtures/pricing-golden.json | awk '{print $1}' > actual.sha256
          if ! diff -u actual.sha256 src/features/invoices/lib/__tests__/fixtures/pricing-golden.sha256; then
            echo "::error::Local pricing-golden.json does not match pricing-golden.sha256"
            exit 1
          fi

          echo "Comparing golden file with revampedBackend_Geargrid..."
          if gh api repos/lazyScriptor/revampedBackend_Geargrid/contents/tests/fixtures/pricing-golden.json --jq .content 2>/dev/null | base64 -d > remote-backend-golden.json; then
            if ! diff -u src/features/invoices/lib/__tests__/fixtures/pricing-golden.json remote-backend-golden.json; then
              echo "::error::pricing-golden.json has drifted between frontend and backend!"
              exit 1
            fi
            echo "Frontend and backend golden files are in exact sync."
          else
            echo "::warning::Unable to fetch backend pricing-golden.json via gh api. Fallback to local sha256 check passed."
          fi

      - name: 5. Verify Zero TS2304 Undeclared Identifiers
        run: |
          OUTPUT=$(npx tsc --noEmit | grep "TS2304" || true)
          if [ -n "$OUTPUT" ]; then
            echo "::error::Found TS2304 undeclared identifier errors:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "Zero TS2304 errors found."

      - name: 6. Execute Pricing Regression Tests
        run: |
          if [ "${{ matrix.tz }}" = "UTC" ]; then
            npm run test:tz:utc -- src/features/invoices/lib/__tests__/pricing-regression.test.ts src/features/invoices/lib/__tests__/periodPricing.test.ts src/features/invoices/lib/__tests__/pricing-rendering.test.tsx src/features/invoices/lib/__tests__/lineCost.test.ts src/features/invoices/components/__tests__/ReturnSettlementDialog.test.tsx src/features/invoices/components/__tests__/PosLedgerPanel.test.tsx src/features/invoices/components/__tests__/LedgerTable.test.tsx src/features/invoices/components/__tests__/InvoiceReceipt.test.tsx src/i18n/__tests__/pricingLabels.test.ts src/features/invoices/lib/__tests__/timezone-lint.test.ts --reporter=verbose --reporter=junit --outputFile=pricing-results-${{ matrix.tz }}.xml
          else
            npm run test:tz:colombo -- src/features/invoices/lib/__tests__/pricing-regression.test.ts src/features/invoices/lib/__tests__/periodPricing.test.ts src/features/invoices/lib/__tests__/pricing-rendering.test.tsx src/features/invoices/lib/__tests__/lineCost.test.ts src/features/invoices/components/__tests__/ReturnSettlementDialog.test.tsx src/features/invoices/components/__tests__/PosLedgerPanel.test.tsx src/features/invoices/components/__tests__/LedgerTable.test.tsx src/features/invoices/components/__tests__/InvoiceReceipt.test.tsx src/i18n/__tests__/pricingLabels.test.ts src/features/invoices/lib/__tests__/timezone-lint.test.ts --reporter=verbose --reporter=junit --outputFile=pricing-results-${{ matrix.tz }}.xml
          fi

      - name: 7. Verify Production Build
        run: npm run build

      - name: 8. Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pricing-results-${{ matrix.tz }}
          path: pricing-results-${{ matrix.tz }}.xml
          if-no-files-found: warn

  build-and-deploy:
    name: Build & Deploy to Production Droplet
    needs: [test-frontend, pricing-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci || npm install

      - name: 4. Build production assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 5. Sync files to Droplet
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/rental-app/frontend
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
